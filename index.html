<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキル順シミュレーター</title>
<style>
body { font-family: sans-serif; max-width: 950px; margin: 30px auto; padding: 0 15px; background: #f5f5f5; }
.box { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; }
h1 { margin-top: 0; }
textarea { width: 100%; min-height: 140px; box-sizing: border-box; padding: 10px; font-size: 16px; }
input, select { padding: 7px; font-size: 15px; }
button { padding: 10px 18px; font-size: 16px; cursor: pointer; }
.setting-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.condition { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.result { padding: 10px; margin-top: 10px; border-radius: 6px; background: #e8f5e9; }
.no-result { background: #ffebee; }
table { width: 100%; border-collapse: collapse; margin-top: 15px; }
th, td { border: 1px solid #ccc; padding: 7px; text-align: center; }
th { background: #eee; }
.left { background: #fff3cd; font-weight: bold; }
</style>
</head>
<body>

<h1>スキル順シミュレーター</h1>

<div class="box">
書き方<br>
通常使用: キャラクター名のみを入力します。 <br>
例: ヒマリ / アル<br>
<br>
即時ドロースキル: キャラ名の後ろに Cn を付けると、その回数分だけ手札にとどまり使用ごとにカウントダウンします。 <br>
例: ドヒナC3（3回継続）<br>
<br>
<br>
手札のカードを状態変更する（リオドヒナ、リオハナコなどの場合に使用）<br>
リオ →ドヒナC2: リオを使用して山札へ送り、山札のドヒナを強制的にC2の状態で呼び出します<br>
リオ、→ドヒナC2: リオを使用して山札へ送り、手札のドヒナ系統を強制的にドヒナC2の状態に更新します<br>
</div>



<div class="box">
<h2>基本設定</h2>
<div class="setting-row">
<label for="slotCount"><b>スキル枠数:</b></label>
<input type="number" id="slotCount" value="3" min="1" max="10" style="width: 70px;" onchange="updateConditionSlotOptions()">
</div>
</div>

<div class="box">
<h2>デッキ</h2>
<textarea id="deckInput">ヒマリ
アル
リオ
ネル
カンナ
セイア</textarea>
</div>

<div class="box">
<h2>スキル使用順</h2>
<textarea id="orderInput">ヒマリ
アル
リオC1
ネルC1
カンナ
リオ
セイア
ネル
アル
ヒマリ
リオC1
カンナ
リオ
セイア
ネル</textarea>
</div>

<div class="box">
<h2>位置条件の設定</h2>
<div id="conditions"></div>
<button onclick="addCondition()">＋ 条件追加</button>
</div>

<div class="box">
<button onclick="search()">🔍 検索</button>
<div id="result"></div>
</div>

<div class="box">
<h2>結果詳細</h2>
<div id="details"></div>
</div>

<script>
function addCondition(turn = "", name = "", slotIdx = 0) {
    const div = document.createElement("div");
    div.className = "condition";
    const slotCount = getSlotCount();
    let options = "";
    for (let i = 0; i < slotCount; i++) {
        options += `<option value="${i}" ${i === slotIdx ? "selected" : ""}>枠${i + 1}</option>`;
    }
    div.innerHTML = `
        <input type="number" class="condition-turn" placeholder="手数" min="1" value="${turn}" style="width: 70px;">
        <span>手目の使用直前：</span>
        <input type="text" class="condition-name" placeholder="キャラクター名" value="${name}" style="width: 120px;">
        <span>が</span>
        <select class="condition-slot">${options}</select>
        <span>に配置</span>
        <button onclick="this.parentElement.remove()">削除</button>
    `;
    document.getElementById("conditions").appendChild(div);
}

function updateConditionSlotOptions() {
    const slotCount = getSlotCount();
    const selects = document.querySelectorAll(".condition-slot");
    selects.forEach(select => {
        const currentVal = parseInt(select.value, 10);
        select.innerHTML = "";
        for (let i = 0; i < slotCount; i++) {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = `枠${i + 1}`;
            if (i === currentVal) opt.selected = true;
            select.appendChild(opt);
        }
    });
}

// 9手目 セイアが 枠1（左側）
addCondition(15, "ネル", 0);

function getSlotCount() {
    const val = parseInt(document.getElementById("slotCount").value, 10);
    return isNaN(val) || val < 1 ? 3 : val;
}

function getDeck() {
    return document.getElementById("deckInput").value.split("\n").map(x => x.trim()).filter(x => x);
}

function getOrder() {
    return document.getElementById("orderInput").value.split("\n").map(x => x.trim()).filter(x => x);
}

function getConditions() {
    const rows = document.querySelectorAll(".condition");
    return [...rows].map(row => {
        return {
            turn: Number(row.querySelector(".condition-turn").value),
            name: row.querySelector(".condition-name").value.trim(),
            slotIdx: Number(row.querySelector(".condition-slot").value)
        };
    }).filter(x => x.turn > 0 && x.name);
}

function parseCard(cardStr) {
    const match = cardStr.match(/^(.+?)(?:C(\d*))?$/);
    if (!match) return { baseName: cardStr, cCount: 0 };
    const baseName = match[1];
    if (match[2] !== undefined) {
        return { baseName, cCount: match[2] === "" ? 1 : parseInt(match[2], 10) };
    } else if (cardStr.endsWith("C")) {
        return { baseName, cCount: 1 };
    }
    return { baseName, cCount: 0 };
}

function getBaseName(cardStr) {
    return parseCard(cardStr).baseName;
}

function processSubAction(slots, deck, actionToken, turn, debug) {
    actionToken = actionToken.trim();
    if (!actionToken) return [{ slots, deck }];

    if (debug) console.log(`[Turn ${turn}] 処理中アクション: "${actionToken}" | 手札: [${slots.join(', ')}] | 山札: [${deck.join(' -> ')}]`);

    // 1. 先頭が 「->」 または 「→」 の場合（例：→ドヒナC3）
    if (actionToken.startsWith("->") || actionToken.startsWith("→")) {
        const targetToken = actionToken.replace(/^->|^→/, "").trim();
        if (!targetToken) return [{ slots, deck }];

        let currentSlots = [...slots];
        const targetBase = getBaseName(targetToken);
        const handTargetIdx = currentSlots.findIndex(s => s !== "-" && getBaseName(s) === targetBase);
        
        if (handTargetIdx === -1) {
            if (debug) console.warn(`[Turn ${turn}] 失敗: 手札変更対象 "${targetBase}" が手札に見つかりません。`);
            return [];
        }

        currentSlots[handTargetIdx] = targetToken;
        if (debug) console.log(`[Turn ${turn}] 手札更新成功: 枠${handTargetIdx + 1} の "${targetBase}" を "${targetToken}" に変更`);

        return [{ slots: currentSlots, deck: [...deck] }];
    }

    // 2. 矢印を含む組み合わせパターン（例：リオ→ドヒナC2）
    if (actionToken.includes("->") || actionToken.includes("→")) {
        const parts = actionToken.split(/->|→/);
        const leftToken = parts[0].trim();
        const rightToken = parts[1].trim();

        let currentSlots = [...slots];
        let currentDeck = [...deck];

        const reqBase = getBaseName(leftToken);
        const foundIdx = currentSlots.findIndex(s => s !== "-" && getBaseName(s) === reqBase);
        if (foundIdx === -1) {
            if (debug) console.warn(`[Turn ${turn}] 失敗: 左側カード "${reqBase}" が手札にありません。`);
            return [];
        }

        currentDeck.push(reqBase);
        currentSlots[foundIdx] = "-";

        if (rightToken) {
            const targetBase = getBaseName(rightToken);
            const deckTargetIdx = currentDeck.findIndex(d => getBaseName(d) === targetBase);
            if (deckTargetIdx === -1) {
                if (debug) console.warn(`[Turn ${turn}] 失敗: 右側カード "${targetBase}" が山札にありません。`);
                return [];
            }

            currentDeck.splice(deckTargetIdx, 1);
            currentSlots[foundIdx] = rightToken;
        }

        return [{ slots: currentSlots, deck: currentDeck }];
    }

    // 3. 通常の単一カード使用処理
    const reqBase = getBaseName(actionToken);
    const matchingIndices = [];
    for (let i = 0; i < slots.length; i++) {
        if (getBaseName(slots[i]) === reqBase) {
            matchingIndices.push(i);
        }
    }

    if (matchingIndices.length === 0) {
        if (debug) console.warn(`[Turn ${turn}] 失敗: 対象カード "${reqBase}" が手札に見つかりません。`);
        return [];
    }

    const results = [];
    for (const idx of matchingIndices) {
        const nextSlots = [...slots];
        const nextDeck = [...deck];

        const reqParsed = parseCard(actionToken);

        if (reqParsed.cCount > 0) {
            nextSlots[idx] = reqParsed.baseName;
            if (debug) console.log(`[Turn ${turn}] C付使用: 枠${idx + 1} の "${reqParsed.baseName}" を保持（消費なし）`);
        } else {
            const returnedCard = getBaseName(nextSlots[idx]);
            nextDeck.push(returnedCard);
            nextSlots[idx] = "-";
            if (debug) console.log(`[Turn ${turn}] カード消費: 枠${idx + 1} の "${returnedCard}" を山札末尾へ移動`);
        }
        results.push({ slots: nextSlots, deck: nextDeck });
    }

    return results;
}

function solve(slots, deck, orderIndex, order, conditions, history, slotCount, debug = false) {
    if (orderIndex >= order.length) {
        return history;
    }

    const nextTurn = orderIndex + 1;
    const rawOrderLine = order[orderIndex];

    const tokens = rawOrderLine.split(/[\s,、]+/).filter(t => t.trim() !== "");

    let currentStates = [{ slots: [...slots], deck: [...deck] }];

    for (const token of tokens) {
        let nextStates = [];
        for (const state of currentStates) {
            const resStates = processSubAction(state.slots, state.deck, token, nextTurn, debug);
            nextStates.push(...resStates);
        }
        currentStates = nextStates;
        if (currentStates.length === 0) break;
    }

    if (currentStates.length === 0) {
        return null;
    }

    // 1ターン内の全サブアクション完了後に空いている手札枠（-）を一括補填
    for (let state of currentStates) {
        for (let i = 0; i < state.slots.length; i++) {
            if (state.slots[i] === "-") {
                const drawn = state.deck.shift() ?? "-";
                state.slots[i] = drawn;
                if (debug) console.log(`[Turn ${nextTurn}] 補充: 枠${i + 1} に "${drawn}" をドロー`);
            }
        }
    }

    for (const finalState of currentStates) {
        const nextHistory = [
            ...history,
            {
                turn: nextTurn,
                use: rawOrderLine,
                slots: [...finalState.slots],
                deck: [...finalState.deck]
            }
        ];

        const res = solve(finalState.slots, finalState.deck, orderIndex + 1, order, conditions, nextHistory, slotCount, debug);
        if (res !== null) return res;
    }

    return null;
}

function permutations(array) {
    const result = [];
    function make(current, remaining) {
        if (remaining.length === 0) {
            result.push([...current]);
            return;
        }
        for (let i = 0; i < remaining.length; i++) {
            make(
                [...current, remaining[i]],
                [...remaining.slice(0, i), ...remaining.slice(i + 1)]
            );
        }
    }
    make([], array);
    return result;
}

function search() {
    console.clear();
    console.log("=== 検索処理を開始します ===");

    const slotCount = getSlotCount();
    const deck = getDeck();
    const order = getOrder();
    const conditions = getConditions();

    if (deck.length < slotCount) {
        alert(`デッキ枚数はスキル枠数（${slotCount}）以上にしてください。`);
        return;
    }

    const candidates = permutations(deck);
    const solutions = [];
    const seenInitial = new Set();

    let count = 0;
    for (const initial of candidates) {
        const key = initial.join(",");
        if (seenInitial.has(key)) continue;
        seenInitial.add(key);

        const initialSlots = initial.slice(0, slotCount);
        const initialDeck = initial.slice(slotCount);

        const initialHistory = [{
            turn: 0,
            use: "初期",
            slots: [...initialSlots],
            deck: [...initialDeck]
        }];

        const isFirst = (count === 0);
        if (isFirst) {
            console.log(`--- [デバッグトレース] 初期手札: [${initialSlots.join(', ')}] | 山札: [${initialDeck.join(' -> ')}] ---`);
        }

        const history = solve(initialSlots, initialDeck, 0, order, conditions, initialHistory, slotCount, isFirst);

        count++;

        if (history === null) continue;

        let isMatch = true;
        for (const cond of conditions) {
            const targetState = history[cond.turn - 1];
            if (!targetState) {
                isMatch = false;
                break;
            }
            const cardInSlot = targetState.slots[cond.slotIdx];
            if (!cardInSlot || getBaseName(cardInSlot) !== getBaseName(cond.name)) {
                isMatch = false;
                break;
            }
        }

        if (isMatch) {
            solutions.push({ history });
        }
    }

    console.log(`検索完了: 合計 ${solutions.length} 件の解が見つかりました。`);
    showResults(solutions, conditions, slotCount);
}

function showResults(solutions, conditions, slotCount) {
    const result = document.getElementById("result");
    const details = document.getElementById("details");
    details.innerHTML = "";

    if (solutions.length === 0) {
        result.innerHTML = `<div class="result no-result">条件をすべて満たす初期配置はありませんでした。（F12のコンソールをご確認ください）</div>`;
        return;
    }

    result.innerHTML = `<div class="result">${solutions.length} 通り見つかりました。</div>`;

    solutions.forEach((sol, number) => {
        const history = sol.history;
        const title = document.createElement("h3");
        title.textContent = `候補 ${number + 1}： [初期手札] ${history[0].slots.join(" / ")} ＋ [山札] ${history[0].deck.join(" → ")}`;
        details.appendChild(title);

        const table = document.createElement("table");
        let headerHTML = `<tr><th>手</th><th>使用</th>`;
        for (let i = 1; i <= slotCount; i++) {
            headerHTML += `<th>枠${i}</th>`;
        }
        headerHTML += `<th>山札</th></tr>`;
        table.innerHTML = headerHTML;

        history.forEach(state => {
            const tr = document.createElement("tr");
            if (conditions.some(c => c.turn - 1 === state.turn)) {
                tr.className = "left";
            }
            let rowHTML = `<td>${state.turn}</td><td>${state.use}</td>`;
            for (let i = 0; i < slotCount; i++) {
                rowHTML += `<td>${state.slots[i] ?? "-"}</td>`;
            }
            rowHTML += `<td>${state.deck.join(" → ")}</td>`;
            tr.innerHTML = rowHTML;
            table.appendChild(tr);
        });

        details.appendChild(table);
    });
}
</script>
</body>
</html>
